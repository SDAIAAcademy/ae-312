sions":[{"n":1,"label":"Session 1","title":"Own tasks, several settings"},{"n":2,"label":"Session 2","title":"Routing and cascades"},{"n":3,"label":"Session 3","title":"Prompt layout for prefix caching"},{"n":4,"label":"Session 4","title":"Semantic caches and their risks"}]},{"n":3,"id":"day3","label":"Day 3","title":"Host or buy, and report","sessions":[{"n":1,"label":"Session 1","title":"Self-hosting economics"},{"n":2,"label":"Session 2","title":"Batch versus interactive"},{"n":3,"label":"Session 3","title":"Cost per successful outcome"},{"n":4,"label":"Session 4","title":"The cost review"}]},{"n":4,"id":"capstone","label":"Capstone","title":"Capstone: the cost review, defended","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-cost-model-q1","type":"single","prompt":"A colleague's cost model sums the successful rows of the log and lands 1% under the invoice in a calm month. The next month has a two-hour provider incident. What happens to the gap?","options":[{"key":"A","text":"It stays near 1%, because failed calls are not billed"},{"key":"B","text":"It shrinks, because fewer requests succeed"},{"key":"C","text":"It widens, because timeouts are billed and the model leaves them out"},{"key":"D","text":"It moves at random from month to month"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The model was close because the calm month had few timeouts. Billed failures come in bursts, so the error is largest in the month someone asks about the bill.","misconceptions":["Assumes failed calls are free: the provider bills a request it started to answer","Reverses the direction: the invoice grows with billed timeouts while the model ignores them","","Treats the gap as noise: it has a cause that can be computed from the log"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-cost-model","title":"A model that is 1% under"},"level":null,"pool":"checkpoint"},{"id":"check-agent-cost-q1","type":"single","prompt":"After a change to a tool, the dispute agent takes 12 steps per session where it took 6. Nothing else changed and the prefix cache still works. What happens to the cost of a session?","options":[{"key":"A","text":"It more than doubles, because each added step also resends a longer history"},{"key":"B","text":"It doubles, because cost is proportional to steps"},{"key":"C","text":"It barely moves, because the history is cached"},{"key":"D","text":"It stays the same, because only failed steps add cost"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Steps 7 to 12 each read a longer prompt than steps 1 to 6 did, and each writes new output and reasoning tokens at the full output price. Caching lowers the slope; it does not flatten it.","misconceptions":["","Counts steps as equal: later steps carry longer prompts than earlier ones","Treats cached input as free: it is billed at a lower price, and output and reasoning are not cached at all","Confuses steps with retries: these steps succeeded and each one is billed in full"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-agent-cost","title":"Twice the steps"},"level":null,"pool":"checkpoint"},{"id":"check-untagged-q1","type":"single","prompt":"8% of the requests on a shared key carry no tag. Finance wants the showback table finished today. What do you do with their cost?","options":[{"key":"A","text":"Give it to the team that owns the key"},{"key":"B","text":"Spread it over all teams by their share of spend"},{"key":"C","text":"Leave it out, since it cannot be attributed"},{"key":"D","text":"Report it in an \"unallocated\" row and open the fix: a key per application"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The table must add up to the invoice and must not claim knowledge it lacks. A visible unallocated row is what gets tags and keys fixed.","misconceptions":["Guesses an owner: the key's owner may be paying for another team's requests, as the experiment showed","Spreads the unknown: the table adds up and nobody has a reason to fix the tags","Hides spend that is on the invoice: the table no longer adds up to what was paid",""],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-untagged","title":"The untagged 8%"},"level":null,"pool":"checkpoint"},{"id":"check-budget-scope-q1","type":"single","prompt":"A gateway has one hard daily budget for all applications. An internal batch job doubles its volume. At the end of the afternoon the budget is reached. Who is refused in the evening?","options":[{"key":"A","text":"Only the batch job, since it caused the overspend"},{"key":"B","text":"Every application in the scope, the customer-facing one included"},{"key":"C","text":"Nobody: the gateway sends an alert and keeps serving"},{"key":"D","text":"The applications with the lowest priority first"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A hard budget refuses every request in its scope once the scope's spend reaches the level. To protect one application from another, give each its own budget.","misconceptions":["Assumes a budget knows who caused the overspend: it only counts what is inside its scope","","Confuses a hard budget with a soft one: a hard level refuses, a soft level alerts","Invents a priority rule the policy does not have: a budget has a scope, not a ranking"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-budget-scope","title":"Three applications, one budget"},"level":null,"pool":"checkpoint"},{"id":"review-day-1-q1","type":"single","prompt":"The dispute agent sends a prompt of 20,000 tokens, 19,200 of them cached. The client times out after the provider has written 300 tokens. How is this attempt billed?","options":[{"key":"A","text":"Not at all, because no answer arrived"},{"key":"B","text":"800 input tokens at the input price, 19,200 at the cached price, 300 at the output price"},{"key":"C","text":"20,000 tokens at the input price and 300 at the output price"},{"key":"D","text":"20,000 at the input price, 19,200 more at the cached price, 300 at the output price"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A timeout is billed for what the provider did. Input includes cached tokens, so only the 800 uncached ones pay the full input price.","misconceptions":["Assumes a failed attempt is free: the provider bills what it started to answer","","Forgets the cached discount: input tokens include the cached ones, at a lower price","Counts cached tokens twice: they are part of the 20,000, not on top of them"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day-1","title":"Which request is on the bill?"},"level":null,"pool":"checkpoint"},{"id":"check-floor-language-q1","type":"single","prompt":"A cheaper configuration scores 95% on 100 tasks: 50 of 50 in English, 45 of 50 in Arabic. The floor is 92% in each language. Most customers write in Arabic. What do you report?","options":[{"key":"A","text":"It passes: 95% is above the floor"},{"key":"B","text":"It passes if the floor for Arabic is lowered to 90%"},{"key":"C","text":"It fails and should be dropped from the table"},{"key":"D","text":"It fails the floor in Arabic; it is a candidate for English traffic only"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The floor holds per language: 45 of 50 is 90%. The result is still useful: a router can send English there, which is the next session.","misconceptions":["Averages over languages: the overall rate hides the language that fails","Moves the floor to fit the candidate: the owner set it before prices were compared","Discards a usable result: the configuration does meet the floor in English",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-floor-language","title":"95% overall"},"level":null,"pool":"checkpoint"},{"id":"check-cascade-cost-q1","type":"single","prompt":"A cascade sends 100 requests to a tier at SAR 0.005 each. 20 fail the check and go to a tier at SAR 0.025. In the end 95 answers are right. What is the cost per successful outcome?","options":[{"key":"A","text":"SAR 0.0105: all 120 calls are paid, divided by 95 successes"},{"key":"B","text":"SAR 0.0100: total spend divided by 100 requests"},{"key":"C","text":"SAR 0.0095: 80 cheap calls and 20 dear ones, divided by 95"},{"key":"D","text":"SAR 0.0150: the mean of the two tiers' prices"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"100 calls at 0.005 plus 20 at 0.025 is SAR 1.00. Divided by the 95 right answers: SAR 0.0105.","misconceptions":["","Divides by requests: the five wrong answers were paid for and are not outcomes","Drops the rejected first attempts: they were billed like any other call","Averages the two prices: ignores how many requests took each path"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-cascade-cost","title":"What the cascade costs"},"level":null,"pool":"checkpoint"},{"id":"check-prefix-q1","type":"single","prompt":"A prompt template puts 6,000 tokens of instructions and retrieved policy text first and the user's question last. Traffic is steady. The provider reports cached tokens on almost no request. What do you check first?","options":[{"key":"A","text":"Whether the cache lifetime is too short"},{"key":"B","text":"Whether the prompt is too short to be cached"},{"key":"C","text":"Whether two real prompts are identical token for token in that first part"},{"key":"D","text":"Whether a larger tier caches better"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A template shows the order of the parts, not their content. Text assembled in a varying order, or a value that changes near the top, breaks the prefix on every request.","misconceptions":["Blames the lifetime: with steady traffic entries are refreshed long before they expire","Blames the size: 6,000 tokens is well above a minimum of about a thousand","","Changes the model before finding the cause: the cache follows the prompt, whatever the tier"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-prefix","title":"The template looks right"},"level":null,"pool":"checkpoint"},{"id":"check-semantic-cache-q1","type":"single","prompt":"A semantic cache at threshold 0.90 served one customer the account balance of another. The team proposes to raise the threshold to 0.97. What do you answer?","options":[{"key":"A","text":"Agreed: at 0.97 only near-identical questions match"},{"key":"B","text":"It will not help: partition entries by customer when the answer used account data, and test it"},{"key":"C","text":"Use a stronger embedding model so the two questions separate"},{"key":"D","text":"Give the entries a lifetime of one hour"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The questions are the same; the data behind the answers differs. Only the scope of the entry can keep them apart, and a test must prove that it does.","misconceptions":["Treats isolation as similarity: two customers asking for their balance use identical words","","Changes the embedding, not the cause: any model places identical questions at similarity 1","Shortens the exposure without removing it: within the lifetime the answer still crosses"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-semantic-cache","title":"The balance of another customer"},"level":null,"pool":"checkpoint"},{"id":"review-day-2-q1","type":"single","prompt":"An assistant sends 8,400 tokens per request, 8,000 of them identical for every customer. The provider reports no cached tokens. The prompt begins with the current time in seconds. What do you change first?","options":[{"key":"A","text":"Move the time to the end of the prompt, so the identical part comes first"},{"key":"B","text":"Add a semantic cache in front of the model"},{"key":"C","text":"Shorten the instructions to 6,000 tokens"},{"key":"D","text":"Ask the provider for a longer cache lifetime"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A prefix is reused only as far as it is identical from the first token. A clock in the first line makes every prompt unique.","misconceptions":["","Adds a second cache before the first one works: a prefix cache needs identical leading tokens","Shortening helps cost a little and leaves the cause in place: the first tokens still differ","A longer lifetime keeps entries that no request can match: nothing is shared from the first token"],"lo":["LO4"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day-2","title":"A hit rate of zero"},"level":null,"pool":"checkpoint"},{"id":"check-break-even-q1","type":"single","prompt":"A team's leased node runs at 15% utilisation. Its break-even against the API tier the team uses today is 10%. A cheaper tier passed the quality floor last week; against it the break-even is 45%. What do you recommend?","options":[{"key":"A","text":"Keep the node: it is above its break-even"},{"key":"B","text":"Lease a second node to bring the cost per request down"},{"key":"C","text":"Move the work to the cheaper tier, and revisit the node if volume triples"},{"key":"D","text":"Reserve the node for a year to lower its hourly price"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The node must beat the best allowed alternative that holds the floor. Against that one it needs three times its present traffic.","misconceptions":["Compares with the price paid today, not with the cheapest option that holds the floor","Utilisation is requests served over capacity: a second node halves it and doubles the bill","","Changes the lease terms without the question: reserved or on demand, 15% is far below 45%"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-break-even","title":"A node at 15%"},"level":null,"pool":"checkpoint"},{"id":"check-batch-q1","type":"single","prompt":"A job classifies 40,000 tickets a day. Its report is read the next morning, and 5% of the tickets are outage reports that an engineer must see within minutes. The batch tier costs half. What do you propose?","options":[{"key":"A","text":"Move every ticket to the batch tier, submitted once a day"},{"key":"B","text":"Keep every ticket on the interactive tier"},{"key":"C","text":"Move every ticket to the batch tier, submitted every five minutes"},{"key":"D","text":"Outage reports interactive, the rest in batches timed so the report is ready by the morning"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Split by who is waiting. The saving is the discount times the share that can wait: here about 47% of the bill.","misconceptions":["Applies the discount to work that cannot wait: an outage report would arrive hours late","Gives up the saving on the 95% that can wait because 5% cannot","A faster schedule shortens the wait for submission; completion still takes minutes to hours",""],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-batch","title":"A report by the morning"},"level":null,"pool":"checkpoint"},{"id":"check-cost-per-outcome-q1","type":"single","prompt":"A new configuration of an agent costs SAR 0.40 per session against 0.80 today. It completes 60% of sessions correctly against 80%, and each failed session is finished by a person at SAR 10. Which costs less per correctly completed task, people included?","options":[{"key":"A","text":"The new one: it costs half per session"},{"key":"B","text":"Today's: about SAR 3.50 against about SAR 7.30"},{"key":"C","text":"The new one: SAR 0.67 against 1.00 per success"},{"key":"D","text":"It cannot be said without the number of sessions"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Per 100 sessions: today 80 + 20 × 10 = 280 over 80 successes; new 40 + 40 × 10 = 440 over 60. The failures cost more than the model.","misconceptions":["Stops at the invoice: 0.40 against 0.80 leaves out the sessions a person has to finish","","Divides model cost by successes only: 0.67 against 1.00 still leaves the people out","The figures are sufficient: cost per session, success rate and the cost of a failure give both totals"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-cost-per-outcome","title":"Half the price per session"},"level":null,"pool":"checkpoint"},{"id":"check-review-q1","type":"single","prompt":"A draft review lists a prompt layout change (82% off the assistant's spend), a router (38% off) and a semantic cache (25% off), each measured alone on the same assistant, and promises finance the three together. What do you change?","options":[{"key":"A","text":"Measure the three applied together in shipping order, or promise only the first"},{"key":"B","text":"Nothing: the three percentages add up to the total saving"},{"key":"C","text":"Report the average of the three, 48%"},{"key":"D","text":"Keep the largest and delete the other two from the review"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"All three act on the same input tokens. After the layout change the router and the cache have a fifth of the spend left to work on.","misconceptions":["","Adds percentages of the same tokens: the sum is above 100% of the spend","Averaging has no meaning here: each option acts on what the one before left","Drops two measured options that may still be worth shipping after the first"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-review","title":"The total on page one"},"level":null,"pool":"checkpoint"},{"id":"q-cost-01","type":"numeric","prompt":"A request sends 12,000 input tokens, 9,000 of them read from the cache, and receives 500 output tokens with no reasoning. Prices per million tokens: input SAR 4, cached input SAR 0.40, output SAR 16. Input tokens include the cached ones. What do 1,000 such requests cost, in SAR?","options":[],"correct":[],"answer":23.6,"tolerance":0.1,"unit":"SAR","explanation":"Per request: 3,000 uncached × 4 + 9,000 cached × 0.40 + 500 output × 16 = 23,600, over a million = SAR 0.0236. For 1,000 requests: SAR 23.60.","misconceptions":[],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"four-kinds-of-token","title":"A log row holds four kinds of token, and they overlap"},"level":"apply","pool":"practice"},{"id":"q-cost-02","type":"single","prompt":"A team's cost model is 12% below the invoice. The model multiplies the column output_tokens by the output price. The application runs with high reasoning, and the log holds no failed request. What explains the gap?","options":[{"key":"A","text":"Cached tokens are priced at the full input price in the model"},{"key":"B","text":"Reasoning tokens are billed as output and are not summed"},{"key":"C","text":"The provider rounds every request up to 1,000 tokens"},{"key":"D","text":"Input tokens are counted twice, once more as cached"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Reasoning tokens are written by the model and billed at the output price. In this log they sit in their own column, so a sum of output_tokens leaves them out and the model comes out low.","misconceptions":["Would make the model higher than the invoice, not lower","","Invents a billing rule that the price sheet does not have","Would make the model higher than the invoice, not lower"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"close-for-the-wrong-reasons","title":"The naive model is 2% off, for two large reasons that cancel"},"level":"analyze","pool":"practice"},{"id":"q-cost-03","type":"numeric","prompt":"A node is leased 10 hours a night for 30 nights at SAR 12 an hour. In that month it served 9,000 requests. What did one request cost on the node, in SAR?","options":[],"correct":[],"answer":0.4,"tolerance":0.005,"unit":"SAR","explanation":"The lease is 10 × 30 × 12 = SAR 3,600, used or idle. Over 9,000 requests that is SAR 0.40 each. Tokens on the node have no price.","misconceptions":[],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"accelerator-hours","title":"A leased accelerator is paid by the hour, used or idle"},"level":"apply","pool":"practice"},{"id":"q-agent-01","type":"single","prompt":"An agent resends its whole history at every step, and the history grows by 1,500 tokens per step. Nothing is cached. A session of 20 steps becomes a session of 40 steps. How do the input tokens of the session change?","options":[{"key":"A","text":"They double, like the number of steps"},{"key":"B","text":"They grow by 30,000 tokens in total"},{"key":"C","text":"They grow to about four times"},{"key":"D","text":"They stay the same after step 20"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Each step resends everything before it, so the total grows with the square of the number of steps: twice the steps, about four times the input tokens.","misconceptions":["Counts each step as if it sent the same amount","Counts only the new tokens and forgets that all earlier ones are sent again","","Assumes the history stops growing"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"every-step-resends","title":"Every step resends everything before it"},"level":"understand","pool":"practice"},{"id":"q-agent-02","type":"single","prompt":"A client sends a request and, after a timeout, retries up to 3 more times. The provider bills a request it started to answer, also when the client gave up. During an incident every attempt times out. A step normally costs SAR 0.05. What does one step cost during the incident?","options":[{"key":"A","text":"SAR 0.00"},{"key":"B","text":"SAR 0.05"},{"key":"C","text":"SAR 0.15"},{"key":"D","text":"SAR 0.20"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"One first attempt and three retries are four billed attempts: 4 × 0.05 = SAR 0.20, with no answer to show for it.","misconceptions":["Assumes a failed attempt is free","Counts the step once, whatever the number of attempts","Counts the retries and forgets the first attempt",""],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"retries-multiply","title":"A retry resends the whole prompt, and an incident multiplies retries"},"level":"apply","pool":"practice"},{"id":"q-agent-03","type":"single","prompt":"Of the ten most expensive sessions of an agent, eight have more than 60 steps and repeat the same tool call. Two have 6 steps, with one tool result of 80,000 tokens. Which pair of fixes addresses both kinds?","options":[{"key":"A","text":"A step limit per session, and a size limit on tool results"},{"key":"B","text":"A cheaper model tier for the agent, and a longer timeout"},{"key":"C","text":"A daily budget for the team, and more retries per step"},{"key":"D","text":"A semantic cache for the agent, and a higher rate limit"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Loops are stopped by a limit on steps; a long context is stopped where it enters, at the tool result. The other pairs lower a price or move a limit and leave both causes in place.","misconceptions":["","Lowers the price of each step and keeps the loop and the long context","A budget stops the day's spend late, and more retries add attempts","Neither acts on the number of steps or on the size of a tool result"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"three-fixes-sized","title":"Three causes, three fixes, each with its size"},"level":"analyze","pool":"practice"},{"id":"q-showback-01","type":"single","prompt":"A gateway spent SAR 10,000 in a month. Keys that belong to one team account for SAR 9,200. A shared key spent SAR 800, and tags identify the application for SAR 650 of it. Where do the remaining SAR 150 go in the showback table?","options":[{"key":"A","text":"Spread over the teams in proportion to their spend"},{"key":"B","text":"On the row of the platform team that runs the gateway"},{"key":"C","text":"Nowhere: the amount is under 2% of the total"},{"key":"D","text":"On a row named unallocated, with an owner to chase it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A showback table sums to the invoice, and what cannot be attributed is shown as its own row so that someone works on it.","misconceptions":["Hides the gap inside rows that did not cause it","Charges the team that operates the gateway for others' spend","The table then no longer sums to the invoice",""],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"unallocated-is-a-row","title":"What nobody owns gets its own row"},"level":"apply","pool":"practice"},{"id":"q-showback-02","type":"single","prompt":"It is the first month of cost attribution on a gateway, and 6% of the spend is unallocated. Finance wants to charge each team's budget from next month. What do you advise?","options":[{"key":"A","text":"Charge from next month, with the unallocated share on the largest team"},{"key":"B","text":"Publish the table for some months and fix attribution, then charge"},{"key":"C","text":"Charge from next month, with the unallocated share split equally"},{"key":"D","text":"Publish nothing until every request carries a tag"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Showback comes before chargeback: teams see and correct the table first. Charging on a table they do not trust starts disputes about the table, not about the spend.","misconceptions":["Charges a team for spend that nobody has attributed","","Charges every team for spend that nobody has attributed","Waits for perfect data, so nobody sees their spend at all"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"showback-before-chargeback","title":"Showback before chargeback"},"level":"evaluate","pool":"practice"},{"id":"q-showback-03","type":"single","prompt":"Team A's key spent SAR 2,000 in a month. SAR 300 of it are requests that team B's application sent through team A's service, and the tags say so. Under a caller-pays rule, what does team A's row show?","options":[{"key":"A","text":"SAR 1,700"},{"key":"B","text":"SAR 2,000"},{"key":"C","text":"SAR 2,300"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Caller pays moves the SAR 300 to the team whose application caused them: 2,000 − 300 = 1,700 for team A, and 300 more on team B's row.","misconceptions":["","Applies the owner-pays rule: the key decides","Adds the amount in place of moving it"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"caller-or-owner","title":"When one application calls another, there is no settled way to split the cost"},"level":"apply","pool":"practice"},{"id":"q-budget-01","type":"single","prompt":"A gateway has one daily budget for all applications. An agent loops and uses the whole budget by midday. What happens to the customer assistant that shares the gateway?","options":[{"key":"A","text":"It continues: a budget applies per application"},{"key":"B","text":"Its requests wait in a queue until the evening"},{"key":"C","text":"Its requests are refused until the window resets"},{"key":"D","text":"It moves to a cheaper tier until the window resets"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A budget acts on its scope. With one budget for the whole gateway, the application that did nothing wrong is refused together with the one that looped.","misconceptions":["Assumes a scope that this policy does not have","A hard limit refuses requests; it does not queue them","","A budget refuses; it does not reroute"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"scope-decides","title":"One budget for the whole gateway refused the wrong application"},"level":"analyze","pool":"practice"},{"id":"q-budget-02","type":"single","prompt":"An application's daily spend over a calm month has a median of SAR 40, and its highest day was SAR 52. Which soft and hard daily limits fit it?","options":[{"key":"A","text":"Soft SAR 30, hard SAR 40"},{"key":"B","text":"Soft SAR 40, hard SAR 52"},{"key":"C","text":"Soft SAR 62, hard SAR 78"},{"key":"D","text":"Soft SAR 400, hard SAR 520"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Limits sit above the highest normal day, with a margin: the soft one warns on an unusual day and the hard one stops a runaway before it costs many days of spend.","misconceptions":["Refuses normal traffic on half of the days","A normal busy day reaches the hard limit","","Ten days of spend can burn before anything trips"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"levels-from-data","title":"Levels come from the month's data, not from a round number"},"level":"apply","pool":"practice"},{"id":"q-budget-03","type":"single","prompt":"A loop sends 30 cheap requests a minute. A long-context session sends 2 requests a minute, each with 80,000 tokens. The gateway has a limit of 12 requests a minute and a daily budget. Which control stops which?","options":[{"key":"A","text":"The rate limit stops the loop; the budget stops the long session"},{"key":"B","text":"The budget stops the loop; the rate limit stops the long session"},{"key":"C","text":"The rate limit stops both, the loop first"},{"key":"D","text":"The budget stops both at the same moment"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A limit on requests per minute acts on speed, a budget on money. The loop is fast and cheap; the long session is slow and expensive.","misconceptions":["","Reverses the two controls","Two requests a minute never reach a limit of twelve","The two spend at very different rates"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"rate-limit-or-budget","title":"A rate limit acts in a minute; a budget acts in a day"},"level":"understand","pool":"practice"},{"id":"q-eval-01","type":"single","prompt":"Three configurations ran on 50 English and 50 Arabic tasks. X: 47 and 44 correct, SAR 0.004 a task. Y: 48 and 47, SAR 0.020. Z: 49 and 48, SAR 0.080. The floor is 92% in each language. Which one do you choose?","options":[{"key":"A","text":"X, the cheapest: its 91% overall is close enough to the floor"},{"key":"B","text":"Y, the cheapest that holds the floor in both languages"},{"key":"C","text":"Z, the one with the highest pass rate"},{"key":"D","text":"X, after the floor for Arabic is set to 88%"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"92% of 50 is 46 tasks. X has 44 in Arabic and fails. Y and Z pass, and Y costs a quarter of Z.","misconceptions":["Averages the languages and rounds towards the floor","","Ignores cost once the floor is held","Moves the floor to fit the candidate"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"floor-per-language","title":"The small tier passes in English and fails in Arabic"},"level":"evaluate","pool":"practice"},{"id":"q-eval-02","type":"single","prompt":"Two configurations score 46 and 47 of 50 on the Arabic tasks. A colleague wants to rank the second above the first. What do you answer?","options":[{"key":"A","text":"The second is better, so choose it whatever it costs"},{"key":"B","text":"Average each with its English score, then rank them"},{"key":"C","text":"Run both once more and keep the higher run of each"},{"key":"D","text":"One task separates them: this sample cannot rank them"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With 50 tasks one task is two points. A difference of one task is inside the noise of the sample; more tasks or a paired comparison would be needed.","misconceptions":["Reads a one-task difference as a ranking","Averaging does not make the sample larger","Keeps the lucky run of each: selection, not measurement",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"one-task-is-two-points","title":"With 50 tasks per language, one task is two points"},"level":"understand","pool":"practice"},{"id":"q-eval-03","type":"single","prompt":"High reasoning lifts a lookup assistant from 95% to 96% and triples its latency. It lifts a multi-step agent from 76% to 91%, where the floor is 90%. Where do you switch it on?","options":[{"key":"A","text":"For the agent only"},{"key":"B","text":"For the assistant only"},{"key":"C","text":"For both applications"},{"key":"D","text":"For neither application"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"For the agent it is the difference between failing and holding the floor. For the assistant it buys one task and costs seconds and output tokens.","misconceptions":["","Buys one task at three times the latency, and leaves the agent below its floor","Pays for reasoning where it changes nothing","Leaves the agent below its floor"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"what-reasoning-buys","title":"Reasoning is paid in output tokens and in seconds: buy it where it helps"},"level":"apply","pool":"practice"},{"id":"q-route-01","type":"numeric","prompt":"A cascade tries every request on a small tier at SAR 0.004 and sends those that fail its check to a medium tier at SAR 0.020. Of 100 requests, 30 are sent on. What do the 100 requests cost, in SAR?","options":[],"correct":[],"answer":1,"tolerance":0.01,"unit":"SAR","explanation":"Every request pays the small tier: 100 × 0.004 = 0.40. Thirty also pay the medium tier: 30 × 0.020 = 0.60. Together SAR 1.00, against 2.00 for the medium tier alone.","misconceptions":[],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"cost-per-successful-outcome","title":"Failed first attempts are paid: divide all spend by the successes"},"level":"apply","pool":"practice"},{"id":"q-route-02","type":"single","prompt":"On 100 requests, policy P costs SAR 1.20 and gives 80 right answers. Policy Q costs SAR 1.80 and gives 96. The floor is 90%. Which policy do you choose, and what does it cost per successful outcome?","options":[{"key":"A","text":"P, at SAR 0.012"},{"key":"B","text":"P, at SAR 0.015"},{"key":"C","text":"Q, at SAR 0.018"},{"key":"D","text":"Q, at SAR 0.019"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"P is below the floor. Q costs 1.80 over 96 successes: SAR 0.019 per successful outcome.","misconceptions":["Chooses below the floor, and divides by requests","Chooses below the floor","Divides by all requests, not by the successes",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"router-results","title":"The router that keeps both floors costs 38% less per success"},"level":"apply","pool":"practice"},{"id":"q-route-03","type":"single","prompt":"The check of a cascade catches 5 of the small tier's 13 wrong answers in Arabic and 2 of its 4 in English. After routing, the pass rate in Arabic is below the floor. What do you change?","options":[{"key":"A","text":"Lower the floor for Arabic to what the cascade reaches"},{"key":"B","text":"Send Arabic requests directly to the medium tier"},{"key":"C","text":"Send English requests directly to the medium tier"},{"key":"D","text":"Remove the check and keep every answer of the small tier"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The check misses most wrong answers in Arabic, so the small tier's errors pass through. Routing Arabic to the tier that holds the floor fixes that and keeps the saving on English.","misconceptions":["Moves the floor to fit the router","","Acts on the language that already passes","Removes the only thing that catches errors"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"what-the-check-misses","title":"The check catches the visible failures; in Arabic most are not visible"},"level":"analyze","pool":"practice"},{"id":"q-prefix-01","type":"single","prompt":"A prompt is built in this order: the customer's name, 6,000 tokens of instructions, the question. Across customers the provider reports no cached tokens. Why?","options":[{"key":"A","text":"The instructions are too long for the cache"},{"key":"B","text":"The question changes on every request"},{"key":"C","text":"The name comes first, so no prefix is shared"},{"key":"D","text":"The entries expire before the next request"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A prefix cache reuses a prompt only as far as it is identical from the first token. A name in the first line makes the prompts of two customers differ at once.","misconceptions":["Length helps a prefix cache: there is a minimum, not a maximum","The question is last: what comes before it could still be shared","","Expiry lowers a hit rate; it does not make it zero in busy hours"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"three-breakers","title":"Three things break the shared prefix, and one is invisible in the template"},"level":"analyze","pool":"practice"},{"id":"q-prefix-02","type":"numeric","prompt":"A prompt has 10,000 input tokens. After a change of layout 9,000 of them are read from the cache. Prices per million tokens: input SAR 3, cached input SAR 0.30. What does the input of 1,000 requests cost after the change, in SAR?","options":[],"correct":[],"answer":5.7,"tolerance":0.05,"unit":"SAR","explanation":"Per request: 1,000 uncached × 3 + 9,000 cached × 0.30 = 5,700, over a million = SAR 0.0057. For 1,000 requests: SAR 5.70, against 30.00 before.","misconceptions":[],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"before-and-after","title":"The same words in another order: 82% cheaper and first token sooner"},"level":"apply","pool":"practice"},{"id":"q-prefix-03","type":"single","prompt":"At night an assistant receives one request every 8 minutes. A cache entry lives 5 minutes, and writing one costs 1.25 times the input price. What does caching do to the cost of the night?","options":[{"key":"A","text":"It raises it: every request writes an entry nobody reads"},{"key":"B","text":"It lowers it as in the day: the prompt is the same"},{"key":"C","text":"It leaves it unchanged: an expired entry costs nothing"},{"key":"D","text":"It lowers it to the cached price for every request"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each entry expires before the next request arrives, so every request pays the write premium and none gets the cached price.","misconceptions":["","The prompt is the same; the traffic is not","The write was paid when the entry was made","No request arrives while an entry is alive"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"when-caching-loses","title":"A cache pays when entries are reused before they expire"},"level":"evaluate","pool":"practice"},{"id":"q-semantic-01","type":"single","prompt":"A semantic cache at threshold 0.90 answers \"How much is plan 85 a month?\" with the stored answer to \"How much is plan 55 a month?\". Both are public prices. What explains it?","options":[{"key":"A","text":"The entries were not partitioned by customer, so they crossed"},{"key":"B","text":"The entries were kept for too many days"},{"key":"C","text":"The embedding has too few dimensions"},{"key":"D","text":"The two questions are close as text and differ in one number"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Similar wording is not the same question. Two sentences that differ in one number sit very close together, and a threshold cannot tell that the number is the point.","misconceptions":["Isolation is about whose data an answer holds; these answers are public","Staleness is about answers that were once right","Any embedding places these two sentences close together",""],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"close-is-not-same","title":"Two questions that differ in the one word that matters"},"level":"analyze","pool":"practice"},{"id":"q-semantic-02","type":"single","prompt":"An assistant answers four kinds of question. Which answer may a semantic cache share between customers?","options":[{"key":"A","text":"A customer's remaining data balance"},{"key":"B","text":"The monthly price of a public plan"},{"key":"C","text":"The status of a customer's dispute"},{"key":"D","text":"The total of a customer's last invoice"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Only an answer built from public data is the same for everyone. The other three were built from one customer's account and stay in that customer's partition.","misconceptions":["Built from one customer's account","","Built from one customer's account","Built from one customer's account"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"scope-the-entries","title":"Scope every entry by whose data produced it, and test that nothing crosses"},"level":"apply","pool":"practice"},{"id":"q-semantic-03","type":"numeric","prompt":"An assistant receives 10,000 questions in a month. A semantic cache answers 30% of them, and 2% of the answers it serves are wrong. How many wrong answers does the cache serve in the month?","options":[],"correct":[],"answer":60,"tolerance":0,"unit":"answers","explanation":"10,000 × 0.30 = 3,000 answers come from the cache, and 2% of them are wrong: 60 customers told something wrong in a month.","misconceptions":[],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"hits-and-wrong-answers","title":"A hit rate is half of a measurement"},"level":"apply","pool":"practice"},{"id":"q-semantic-04","type":"multi","prompt":"A team reports that its semantic cache answers 35% of questions. Which two measurements have to stand beside that figure before the cache ships?","options":[{"key":"A","text":"The rate of wrong answers served from the cache"},{"key":"B","text":"The number of dimensions of the embedding"},{"key":"C","text":"A test that no answer crosses from one customer to another"},{"key":"D","text":"The memory the cache uses, in megabytes"}],"correct":[0,2],"answer":null,"tolerance":null,"unit":null,"explanation":"A hit rate says how much is saved. The wrong-answer rate and the isolation test say what the saving costs in correctness and in privacy.","misconceptions":["","A property of the tool, not of its answers","","An operating figure that says nothing about correctness"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"choose-the-threshold","title":"With isolation fixed, the threshold trades hits for wrong answers"},"level":"evaluate","pool":"practice"},{"id":"q-host-01","type":"numeric","prompt":"A node costs SAR 10 an hour with operations. At the latency objective it serves 2,000 requests an hour. The API price of the same request is SAR 0.02. At what utilisation does the node break even, in percent?","options":[],"correct":[],"answer":25,"tolerance":0.5,"unit":"%","explanation":"The node's cost per request is 10 / (2,000 × utilisation). Setting it equal to 0.02 gives a utilisation of 0.25: 500 requests an hour, every leased hour.","misconceptions":[],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"break-even","title":"Break-even depends on which API price the node has to beat"},"level":"apply","pool":"practice"},{"id":"q-host-02","type":"single","prompt":"Call transcripts are classified Restricted and may be processed in the Kingdom only: no transfer assessment is approved. A global API is the cheapest option, an in-Kingdom API costs 30% more, and a leased node in the Kingdom costs eight times more. All three hold the quality floor. Which do you recommend?","options":[{"key":"A","text":"The global API, as the cheapest that holds the floor"},{"key":"B","text":"The global API, while the transfer assessment is requested"},{"key":"C","text":"The in-Kingdom API, as the cheapest allowed placement"},{"key":"D","text":"The leased node, as the only way to keep data in the Kingdom"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Placement comes before price: the register removes the global option. Among the allowed ones, the in-Kingdom API is the cheapest that holds the floor.","misconceptions":["Compares prices before reading the register","Acts on an approval that does not exist yet","","An in-Kingdom region of a provider also keeps the data in the Kingdom"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"khulasa-four-options","title":"Four options for Khulasa: placement, floor, then price"},"level":"evaluate","pool":"practice"},{"id":"q-host-03","type":"single","prompt":"A benchmark of a node: at 8 concurrent requests, 40 requests a minute with a 95th percentile latency of 9 s; at 16, 70 a minute and 14 s; at 32, 90 a minute and 28 s. The objective is 95% of requests within 15 s. What capacity per hour goes into the cost model?","options":[{"key":"A","text":"2,400 requests"},{"key":"B","text":"4,200 requests"},{"key":"C","text":"5,400 requests"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Capacity is the highest throughput that still meets the objective: 70 a minute at 14 s, so 4,200 an hour. At 90 a minute the latency is 28 s.","misconceptions":["Takes the lowest load as the safe one and wastes capacity","","Reads the highest throughput and ignores the objective"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"capacity-at-the-objective","title":"Capacity is what the node serves while it still meets the latency objective"},"level":"analyze","pool":"practice"},{"id":"q-host-04","type":"single","prompt":"A node costs SAR 16 an hour on demand, or SAR 7,200 a month on a 12-month commitment. A team leased it 380, 395, 372, 410, 388 and 401 hours in the last six months and expects the same next year. What do you recommend?","options":[{"key":"A","text":"Commit: a committed hour costs SAR 9.68, far below the SAR 16 on-demand hour"},{"key":"B","text":"Commit: usage this steady is what a commitment is for"},{"key":"C","text":"Stay on demand: every month is below the 450-hour break-even"},{"key":"D","text":"Commit once the monthly average passes 400 hours"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The commitment pays above 7,200 / 16 = 450 leased hours a month. The busiest month was 410 hours, SAR 6,560 on demand; the average month, 391 hours, costs SAR 6,256 against 7,200 committed.","misconceptions":["Compares hourly rates and forgets that the commitment is paid for every hour, used or not","Takes steady usage as enough: it must also stay above the break-even hours","","Sets the threshold without dividing the commitment by the hourly price"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"commitment-break-even","title":"Commit when every month of the term stays above the break-even hours"},"level":"apply","pool":"practice"},{"id":"q-batch-01","type":"numeric","prompt":"A job costs SAR 2,000 a month on the interactive tier. One request in ten is urgent and stays interactive. The rest moves to a batch tier at half the price. What does the month cost now, in SAR?","options":[],"correct":[],"answer":1100,"tolerance":1,"unit":"SAR","explanation":"The urgent tenth still costs SAR 200. The other SAR 1,800 are halved to 900. Together SAR 1,100: a saving of 45%, not 50%.","misconceptions":[],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"what-cannot-wait","title":"Split the workload: 8% of the calls cannot wait"},"level":"apply","pool":"practice"},{"id":"q-batch-02","type":"single","prompt":"Batches are submitted every 6 hours, and 95% of them complete within 3 hours. The owner needs nearly every result within 8 hours of the request. Does the schedule meet the need?","options":[{"key":"A","text":"Yes: a batch completes within 3 hours"},{"key":"B","text":"No: a request can wait 6 hours, then 3"},{"key":"C","text":"Yes: the average wait is 3 hours, plus 3"},{"key":"D","text":"No: the provider promises only 24 hours"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Turnaround is the wait for the next submission plus the completion time. A request that just missed a submission waits 6 hours and then up to 3: 9 hours.","misconceptions":["Forgets the wait before submission","","Uses the average where the need is about nearly every request","Uses the ceiling of the terms, not the recorded completion times"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"turnaround","title":"Turnaround is the wait for the next submission plus the completion time"},"level":"apply","pool":"practice"},{"id":"q-batch-03","type":"single","prompt":"A job already runs on a batch tier at half the price. Its prompt is 10% fixed instructions and 90% a transcript that never repeats. Why does adding a prefix cache change the bill only a little?","options":[{"key":"A","text":"The cache discounts only the fixed 10% of the input"},{"key":"B","text":"Two discounts are never combined on one batch tier request"},{"key":"C","text":"The batch tier already caches the whole prompt"},{"key":"D","text":"Cached tokens cost more on a batch tier"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A prefix cache acts on the part of the prompt that repeats. Here that is a tenth of the input, so nine tenths of the tokens are not touched by it.","misconceptions":["","Whether they combine is the provider's rule, and some combine them","A batch tier discounts price; it does not reuse prompts","Invents a rule that no price sheet in the course has"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"stacking-discounts","title":"Discounts stack only on the tokens they both touch"},"level":"understand","pool":"practice"},{"id":"q-outcome-01","type":"numeric","prompt":"An agent handles 1,000 disputes at SAR 0.50 of model cost each. It resolves 700 correctly, escalates 200 to a person at SAR 20 each and resolves 100 wrongly, each reworked at SAR 50. What does a correctly resolved dispute cost, people included, in SAR?","options":[],"correct":[],"answer":13.57,"tolerance":0.05,"unit":"SAR","explanation":"Model 500 + escalations 4,000 + rework 5,000 = SAR 9,500, over 700 correctly resolved disputes: SAR 13.57. The model is 5% of it.","misconceptions":[],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"the-people-in-the-cost","title":"With the people who handle its failures, the cheaper configuration costs twice as much"},"level":"apply","pool":"practice"},{"id":"q-outcome-02","type":"single","prompt":"Configuration A costs SAR 7.00 per correctly resolved dispute, people included, and 5% of its resolutions are wrong. B costs SAR 6.20, and 9% are wrong. The owner's floor is at most 6% wrong. Which runs in production?","options":[{"key":"A","text":"B, because it costs less per resolved dispute"},{"key":"B","text":"B, after the floor is moved to 9% wrong"},{"key":"C","text":"B for half of the disputes, to average 7% wrong"},{"key":"D","text":"A, because B is cheaper and fails the floor"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The floor is applied first, then the price. B is cheaper per outcome and resolves too many disputes wrongly; only A is a candidate.","misconceptions":["Compares prices before the floor","Moves the floor to fit the candidate","An average of 7% is still above the floor",""],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"the-floor-in-production","title":"B resolves fewer disputes, escalates twice as many and gets more of them wrong"},"level":"evaluate","pool":"practice"},{"id":"q-outcome-03","type":"single","prompt":"5,000 agent sessions cost SAR 4,000. Outcomes exist for 4,600 of them, and 3,800 of those were resolved. The 400 sessions without an outcome cost SAR 500. An analyst reports 4,000 / 3,800 as the cost per resolved session. What is wrong with it?","options":[{"key":"A","text":"The cost holds unreviewed sessions; the outcomes do not"},{"key":"B","text":"The unreviewed sessions should all be counted as resolved"},{"key":"C","text":"The unreviewed sessions should be counted as failed"},{"key":"D","text":"No unit cost exists until every session is reviewed"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Numerator and denominator must cover the same sessions: 3,500 / 3,800 for the reviewed ones, with the SAR 500 of unreviewed spend reported beside it.","misconceptions":["","Invents outcomes that nobody recorded","Invents outcomes that nobody recorded","A unit cost on the reviewed sessions is valid when the rest is reported"],"lo":["LO6"],"day":3,"session":3,"slide":{"deck":"day3","id":"what-did-not-join","title":"Cost and outcomes live in two systems, and the join never matches completely"},"level":"analyze","pool":"practice"},{"id":"q-review-01","type":"single","prompt":"Five candidates, in SAR a month: A saves 3,000 and holds its quality floor; B saves 2,500 and fails its floor; C saves 900, D saves 600 and E saves 200, and all three hold theirs. Which three does the review recommend?","options":[{"key":"A","text":"A, B and C"},{"key":"B","text":"A, C and D"},{"key":"C","text":"C, D and E"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The floor is applied first, then the ranking by measured saving. B is named in the review as the option that is refused, with the reason.","misconceptions":["Ranks by saving alone and ships a loss of quality","","Prefers small changes to the measured ranking"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"seven-candidates","title":"Seven candidates from three days, ranked by what they save"},"level":"evaluate","pool":"practice"},{"id":"q-review-02","type":"single","prompt":"A provider publishes no energy figures. The team has assumed watt-hours per thousand tokens for each tier. How does energy appear in the cost review?","options":[{"key":"A","text":"It is left out until measured figures exist"},{"key":"B","text":"As a measured figure, since the tokens are measured"},{"key":"C","text":"Per thousand requests beside cost, labelled as assumed"},{"key":"D","text":"As the cost divided by the price of electricity"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The figure ranks the options and shows idle capacity. Labelled as assumed, with its source, it informs without being quoted as a measurement.","misconceptions":["Loses a ranking the readers can use","Measured tokens times an assumed factor is an assumed figure","","An API price holds far more than electricity"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"energy-beside-cost","title":"Report energy beside cost, and say where the figure comes from"},"level":"apply","pool":"practice"},{"id":"q-review-03","type":"single","prompt":"A review has three options, in SAR a month: 1,000 on the lease of a node, 600 on the tier of a batch job, and 400 on the prompts of the same batch job, measured before the tier change. Which total can the review promise?","options":[{"key":"A","text":"SAR 1,000"},{"key":"B","text":"SAR 1,600"},{"key":"C","text":"SAR 2,000"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The first two act on different invoice lines and add up. The third acts on tokens that the second already made cheaper, so its saving after the tier change is not known yet.","misconceptions":["Drops a saving on a separate invoice line","","Adds a saving measured on the old price of the same tokens"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"savings-do-not-add","title":"Savings add across invoice lines, not on the same tokens"},"level":"analyze","pool":"practice"},{"id":"q-review-04","type":"single","prompt":"A layout change was measured on a replay of two busy hours and cut the cost of those hours by 80%. The evaluation tasks were not run again. Which sentence belongs in the review?","options":[{"key":"A","text":"The change saves 80% of the application's monthly spend"},{"key":"B","text":"Quality is unchanged, as the prompt holds the same words"},{"key":"C","text":"Nothing was left out: every figure comes from the log"},{"key":"D","text":"Measured on two busy hours; quality was not retested"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A review states what was measured and on what, and names what was not. The month is not two busy hours, and the same words in another order are a new prompt until tested.","misconceptions":["Extends two busy hours to a month that has quiet nights","States a result that nobody measured","Hides the test that was not run",""],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"anatomy-of-the-review","title":"Six short sections, in the order the readers ask their questions"},"level":"evaluate","pool":"practice"}]}</script>
