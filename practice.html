<h2>Day 1: Where the money goes</h2>
<ol>
<li><p>A colleague's cost model sums the successful rows of the log and lands 1% under the invoice in a calm month. The next month has a two-hour provider incident. What happens to the gap?</p><ul><li><b>A.</b> It stays near 1%, because failed calls are not billed</li><li><b>B.</b> It shrinks, because fewer requests succeed</li><li><b>C.</b> It widens, because timeouts are billed and the model leaves them out</li><li><b>D.</b> It moves at random from month to month</li></ul></li>
<li><p>After a change to a tool, the dispute agent takes 12 steps per session where it took 6. Nothing else changed and the prefix cache still works. What happens to the cost of a session?</p><ul><li><b>A.</b> It more than doubles, because each added step also resends a longer history</li><li><b>B.</b> It doubles, because cost is proportional to steps</li><li><b>C.</b> It barely moves, because the history is cached</li><li><b>D.</b> It stays the same, because only failed steps add cost</li></ul></li>
<li><p>8% of the requests on a shared key carry no tag. Finance wants the showback table finished today. What do you do with their cost?</p><ul><li><b>A.</b> Give it to the team that owns the key</li><li><b>B.</b> Spread it over all teams by their share of spend</li><li><b>C.</b> Leave it out, since it cannot be attributed</li><li><b>D.</b> Report it in an "unallocated" row and open the fix: a key per application</li></ul></li>
<li><p>A gateway has one hard daily budget for all applications. An internal batch job doubles its volume. At the end of the afternoon the budget is reached. Who is refused in the evening?</p><ul><li><b>A.</b> Only the batch job, since it caused the overspend</li><li><b>B.</b> Every application in the scope, the customer-facing one included</li><li><b>C.</b> Nobody: the gateway sends an alert and keeps serving</li><li><b>D.</b> The applications with the lowest priority first</li></ul></li>
<li><p>A request sends 12,000 input tokens, 9,000 of them read from the cache, and receives 500 output tokens with no reasoning. Prices per million tokens: input SAR 4, cached input SAR 0.40, output SAR 16. Input tokens include the cached ones. What do 1,000 such requests cost, in SAR? <span class="unit">(SAR)</span></p></li>
<li><p>A team's cost model is 12% below the invoice. The model multiplies the column output_tokens by the output price. The application runs with high reasoning, and the log holds no failed request. What explains the gap?</p><ul><li><b>A.</b> Cached tokens are priced at the full input price in the model</li><li><b>B.</b> Reasoning tokens are billed as output and are not summed</li><li><b>C.</b> The provider rounds every request up to 1,000 tokens</li><li><b>D.</b> Input tokens are counted twice, once more as cached</li></ul></li>
<li><p>A node is leased 10 hours a night for 30 nights at SAR 12 an hour. In that month it served 9,000 requests. What did one request cost on the node, in SAR? <span class="unit">(SAR)</span></p></li>
<li><p>An agent resends its whole history at every step, and the history grows by 1,500 tokens per step. Nothing is cached. A session of 20 steps becomes a session of 40 steps. How do the input tokens of the session change?</p><ul><li><b>A.</b> They double, like the number of steps</li><li><b>B.</b> They grow by 30,000 tokens in total</li><li><b>C.</b> They grow to about four times</li><li><b>D.</b> They stay the same after step 20</li></ul></li>
<li><p>A client sends a request and, after a timeout, retries up to 3 more times. The provider bills a request it started to answer, also when the client gave up. During an incident every attempt times out. A step normally costs SAR 0.05. What does one step cost during the incident?</p><ul><li><b>A.</b> SAR 0.00</li><li><b>B.</b> SAR 0.05</li><li><b>C.</b> SAR 0.15</li><li><b>D.</b> SAR 0.20</li></ul></li>
<li><p>Of the ten most expensive sessions of an agent, eight have more than 60 steps and repeat the same tool call. Two have 6 steps, with one tool result of 80,000 tokens. Which pair of fixes addresses both kinds?</p><ul><li><b>A.</b> A step limit per session, and a size limit on tool results</li><li><b>B.</b> A cheaper model tier for the agent, and a longer timeout</li><li><b>C.</b> A daily budget for the team, and more retries per step</li><li><b>D.</b> A semantic cache for the agent, and a higher rate limit</li></ul></li>
<li><p>A gateway spent SAR 10,000 in a month. Keys that belong to one team account for SAR 9,200. A shared key spent SAR 800, and tags identify the application for SAR 650 of it. Where do the remaining SAR 150 go in the showback table?</p><ul><li><b>A.</b> Spread over the teams in proportion to their spend</li><li><b>B.</b> On the row of the platform team that runs the gateway</li><li><b>C.</b> Nowhere: the amount is under 2% of the total</li><li><b>D.</b> On a row named unallocated, with an owner to chase it</li></ul></li>
<li><p>It is the first month of cost attribution on a gateway, and 6% of the spend is unallocated. Finance wants to charge each team's budget from next month. What do you advise?</p><ul><li><b>A.</b> Charge from next month, with the unallocated share on the largest team</li><li><b>B.</b> Publish the table for some months and fix attribution, then charge</li><li><b>C.</b> Charge from next month, with the unallocated share split equally</li><li><b>D.</b> Publish nothing until every request carries a tag</li></ul></li>
<li><p>Team A's key spent SAR 2,000 in a month. SAR 300 of it are requests that team B's application sent through team A's service, and the tags say so. Under a caller-pays rule, what does team A's row show?</p><ul><li><b>A.</b> SAR 1,700</li><li><b>B.</b> SAR 2,000</li><li><b>C.</b> SAR 2,300</li></ul></li>
<li><p>A gateway has one daily budget for all applications. An agent loops and uses the whole budget by midday. What happens to the customer assistant that shares the gateway?</p><ul><li><b>A.</b> It continues: a budget applies per application</li><li><b>B.</b> Its requests wait in a queue until the evening</li><li><b>C.</b> Its requests are refused until the window resets</li><li><b>D.</b> It moves to a cheaper tier until the window resets</li></ul></li>
<li><p>An application's daily spend over a calm month has a median of SAR 40, and its highest day was SAR 52. Which soft and hard daily limits fit it?</p><ul><li><b>A.</b> Soft SAR 30, hard SAR 40</li><li><b>B.</b> Soft SAR 40, hard SAR 52</li><li><b>C.</b> Soft SAR 62, hard SAR 78</li><li><b>D.</b> Soft SAR 400, hard SAR 520</li></ul></li>
<li><p>A loop sends 30 cheap requests a minute. A long-context session sends 2 requests a minute, each with 80,000 tokens. The gateway has a limit of 12 requests a minute and a daily budget. Which control stops which?</p><ul><li><b>A.</b> The rate limit stops the loop; the budget stops the long session</li><li><b>B.</b> The budget stops the loop; the rate limit stops the long session</li><li><b>C.</b> The rate limit stops both, the loop first</li><li><b>D.</b> The budget stops both at the same moment</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Route and cache</h2>
<ol>
<li><p>The dispute agent sends a prompt of 20,000 tokens, 19,200 of them cached. The client times out after the provider has written 300 tokens. How is this attempt billed?</p><ul><li><b>A.</b> Not at all, because no answer arrived</li><li><b>B.</b> 800 input tokens at the input price, 19,200 at the cached price, 300 at the output price</li><li><b>C.</b> 20,000 tokens at the input price and 300 at the output price</li><li><b>D.</b> 20,000 at the input price, 19,200 more at the cached price, 300 at the output price</li></ul></li>
<li><p>A cheaper configuration scores 95% on 100 tasks: 50 of 50 in English, 45 of 50 in Arabic. The floor is 92% in each language. Most customers write in Arabic. What do you report?</p><ul><li><b>A.</b> It passes: 95% is above the floor</li><li><b>B.</b> It passes if the floor for Arabic is lowered to 90%</li><li><b>C.</b> It fails and should be dropped from the table</li><li><b>D.</b> It fails the floor in Arabic; it is a candidate for English traffic only</li></ul></li>
<li><p>A cascade sends 100 requests to a tier at SAR 0.005 each. 20 fail the check and go to a tier at SAR 0.025. In the end 95 answers are right. What is the cost per successful outcome?</p><ul><li><b>A.</b> SAR 0.0105: all 120 calls are paid, divided by 95 successes</li><li><b>B.</b> SAR 0.0100: total spend divided by 100 requests</li><li><b>C.</b> SAR 0.0095: 80 cheap calls and 20 dear ones, divided by 95</li><li><b>D.</b> SAR 0.0150: the mean of the two tiers' prices</li></ul></li>
<li><p>A prompt template puts 6,000 tokens of instructions and retrieved policy text first and the user's question last. Traffic is steady. The provider reports cached tokens on almost no request. What do you check first?</p><ul><li><b>A.</b> Whether the cache lifetime is too short</li><li><b>B.</b> Whether the prompt is too short to be cached</li><li><b>C.</b> Whether two real prompts are identical token for token in that first part</li><li><b>D.</b> Whether a larger tier caches better</li></ul></li>
<li><p>A semantic cache at threshold 0.90 served one customer the account balance of another. The team proposes to raise the threshold to 0.97. What do you answer?</p><ul><li><b>A.</b> Agreed: at 0.97 only near-identical questions match</li><li><b>B.</b> It will not help: partition entries by customer when the answer used account data, and test it</li><li><b>C.</b> Use a stronger embedding model so the two questions separate</li><li><b>D.</b> Give the entries a lifetime of one hour</li></ul></li>
<li><p>Three configurations ran on 50 English and 50 Arabic tasks. X: 47 and 44 correct, SAR 0.004 a task. Y: 48 and 47, SAR 0.020. Z: 49 and 48, SAR 0.080. The floor is 92% in each language. Which one do you choose?</p><ul><li><b>A.</b> X, the cheapest: its 91% overall is close enough to the floor</li><li><b>B.</b> Y, the cheapest that holds the floor in both languages</li><li><b>C.</b> Z, the one with the highest pass rate</li><li><b>D.</b> X, after the floor for Arabic is set to 88%</li></ul></li>
<li><p>Two configurations score 46 and 47 of 50 on the Arabic tasks. A colleague wants to rank the second above the first. What do you answer?</p><ul><li><b>A.</b> The second is better, so choose it whatever it costs</li><li><b>B.</b> Average each with its English score, then rank them</li><li><b>C.</b> Run both once more and keep the higher run of each</li><li><b>D.</b> One task separates them: this sample cannot rank them</li></ul></li>
<li><p>High reasoning lifts a lookup assistant from 95% to 96% and triples its latency. It lifts a multi-step agent from 76% to 91%, where the floor is 90%. Where do you switch it on?</p><ul><li><b>A.</b> For the agent only</li><li><b>B.</b> For the assistant only</li><li><b>C.</b> For both applications</li><li><b>D.</b> For neither application</li></ul></li>
<li><p>A cascade tries every request on a small tier at SAR 0.004 and sends those that fail its check to a medium tier at SAR 0.020. Of 100 requests, 30 are sent on. What do the 100 requests cost, in SAR? <span class="unit">(SAR)</span></p></li>
<li><p>On 100 requests, policy P costs SAR 1.20 and gives 80 right answers. Policy Q costs SAR 1.80 and gives 96. The floor is 90%. Which policy do you choose, and what does it cost per successful outcome?</p><ul><li><b>A.</b> P, at SAR 0.012</li><li><b>B.</b> P, at SAR 0.015</li><li><b>C.</b> Q, at SAR 0.018</li><li><b>D.</b> Q, at SAR 0.019</li></ul></li>
<li><p>The check of a cascade catches 5 of the small tier's 13 wrong answers in Arabic and 2 of its 4 in English. After routing, the pass rate in Arabic is below the floor. What do you change?</p><ul><li><b>A.</b> Lower the floor for Arabic to what the cascade reaches</li><li><b>B.</b> Send Arabic requests directly to the medium tier</li><li><b>C.</b> Send English requests directly to the medium tier</li><li><b>D.</b> Remove the check and keep every answer of the small tier</li></ul></li>
<li><p>A prompt is built in this order: the customer's name, 6,000 tokens of instructions, the question. Across customers the provider reports no cached tokens. Why?</p><ul><li><b>A.</b> The instructions are too long for the cache</li><li><b>B.</b> The question changes on every request</li><li><b>C.</b> The name comes first, so no prefix is shared</li><li><b>D.</b> The entries expire before the next request</li></ul></li>
<li><p>A prompt has 10,000 input tokens. After a change of layout 9,000 of them are read from the cache. Prices per million tokens: input SAR 3, cached input SAR 0.30. What does the input of 1,000 requests cost after the change, in SAR? <span class="unit">(SAR)</span></p></li>
<li><p>At night an assistant receives one request every 8 minutes. A cache entry lives 5 minutes, and writing one costs 1.25 times the input price. What does caching do to the cost of the night?</p><ul><li><b>A.</b> It raises it: every request writes an entry nobody reads</li><li><b>B.</b> It lowers it as in the day: the prompt is the same</li><li><b>C.</b> It leaves it unchanged: an expired entry costs nothing</li><li><b>D.</b> It lowers it to the cached price for every request</li></ul></li>
<li><p>A semantic cache at threshold 0.90 answers "How much is plan 85 a month?" with the stored answer to "How much is plan 55 a month?". Both are public prices. What explains it?</p><ul><li><b>A.</b> The entries were not partitioned by customer, so they crossed</li><li><b>B.</b> The entries were kept for too many days</li><li><b>C.</b> The embedding has too few dimensions</li><li><b>D.</b> The two questions are close as text and differ in one number</li></ul></li>
<li><p>An assistant answers four kinds of question. Which answer may a semantic cache share between customers?</p><ul><li><b>A.</b> A customer's remaining data balance</li><li><b>B.</b> The monthly price of a public plan</li><li><b>C.</b> The status of a customer's dispute</li><li><b>D.</b> The total of a customer's last invoice</li></ul></li>
<li><p>An assistant receives 10,000 questions in a month. A semantic cache answers 30% of them, and 2% of the answers it serves are wrong. How many wrong answers does the cache serve in the month? <span class="unit">(answers)</span></p></li>
<li><p>A team reports that its semantic cache answers 35% of questions. Which two measurements have to stand beside that figure before the cache ships?</p><ul><li><b>A.</b> The rate of wrong answers served from the cache</li><li><b>B.</b> The number of dimensions of the embedding</li><li><b>C.</b> A test that no answer crosses from one customer to another</li><li><b>D.</b> The memory the cache uses, in megabytes</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Host or buy, and report</h2>
<ol>
<li><p>An assistant sends 8,400 tokens per request, 8,000 of them identical for every customer. The provider reports no cached tokens. The prompt begins with the current time in seconds. What do you change first?</p><ul><li><b>A.</b> Move the time to the end of the prompt, so the identical part comes first</li><li><b>B.</b> Add a semantic cache in front of the model</li><li><b>C.</b> Shorten the instructions to 6,000 tokens</li><li><b>D.</b> Ask the provider for a longer cache lifetime</li></ul></li>
<li><p>A team's leased node runs at 15% utilisation. Its break-even against the API tier the team uses today is 10%. A cheaper tier passed the quality floor last week; against it the break-even is 45%. What do you recommend?</p><ul><li><b>A.</b> Keep the node: it is above its break-even</li><li><b>B.</b> Lease a second node to bring the cost per request down</li><li><b>C.</b> Move the work to the cheaper tier, and revisit the node if volume triples</li><li><b>D.</b> Reserve the node for a year to lower its hourly price</li></ul></li>
<li><p>A job classifies 40,000 tickets a day. Its report is read the next morning, and 5% of the tickets are outage reports that an engineer must see within minutes. The batch tier costs half. What do you propose?</p><ul><li><b>A.</b> Move every ticket to the batch tier, submitted once a day</li><li><b>B.</b> Keep every ticket on the interactive tier</li><li><b>C.</b> Move every ticket to the batch tier, submitted every five minutes</li><li><b>D.</b> Outage reports interactive, the rest in batches timed so the report is ready by the morning</li></ul></li>
<li><p>A new configuration of an agent costs SAR 0.40 per session against 0.80 today. It completes 60% of sessions correctly against 80%, and each failed session is finished by a person at SAR 10. Which costs less per correctly completed task, people included?</p><ul><li><b>A.</b> The new one: it costs half per session</li><li><b>B.</b> Today's: about SAR 3.50 against about SAR 7.30</li><li><b>C.</b> The new one: SAR 0.67 against 1.00 per success</li><li><b>D.</b> It cannot be said without the number of sessions</li></ul></li>
<li><p>A draft review lists a prompt layout change (82% off the assistant's spend), a router (38% off) and a semantic cache (25% off), each measured alone on the same assistant, and promises finance the three together. What do you change?</p><ul><li><b>A.</b> Measure the three applied together in shipping order, or promise only the first</li><li><b>B.</b> Nothing: the three percentages add up to the total saving</li><li><b>C.</b> Report the average of the three, 48%</li><li><b>D.</b> Keep the largest and delete the other two from the review</li></ul></li>
<li><p>A node costs SAR 10 an hour with operations. At the latency objective it serves 2,000 requests an hour. The API price of the same request is SAR 0.02. At what utilisation does the node break even, in percent? <span class="unit">(%)</span></p></li>
<li><p>Call transcripts are classified Restricted and may be processed in the Kingdom only: no transfer assessment is approved. A global API is the cheapest option, an in-Kingdom API costs 30% more, and a leased node in the Kingdom costs eight times more. All three hold the quality floor. Which do you recommend?</p><ul><li><b>A.</b> The global API, as the cheapest that holds the floor</li><li><b>B.</b> The global API, while the transfer assessment is requested</li><li><b>C.</b> The in-Kingdom API, as the cheapest allowed placement</li><li><b>D.</b> The leased node, as the only way to keep data in the Kingdom</li></ul></li>
<li><p>A benchmark of a node: at 8 concurrent requests, 40 requests a minute with a 95th percentile latency of 9 s; at 16, 70 a minute and 14 s; at 32, 90 a minute and 28 s. The objective is 95% of requests within 15 s. What capacity per hour goes into the cost model?</p><ul><li><b>A.</b> 2,400 requests</li><li><b>B.</b> 4,200 requests</li><li><b>C.</b> 5,400 requests</li></ul></li>
<li><p>A node costs SAR 16 an hour on demand, or SAR 7,200 a month on a 12-month commitment. A team leased it 380, 395, 372, 410, 388 and 401 hours in the last six months and expects the same next year. What do you recommend?</p><ul><li><b>A.</b> Commit: a committed hour costs SAR 9.68, far below the SAR 16 on-demand hour</li><li><b>B.</b> Commit: usage this steady is what a commitment is for</li><li><b>C.</b> Stay on demand: every month is below the 450-hour break-even</li><li><b>D.</b> Commit once the monthly average passes 400 hours</li></ul></li>
<li><p>A job costs SAR 2,000 a month on the interactive tier. One request in ten is urgent and stays interactive. The rest moves to a batch tier at half the price. What does the month cost now, in SAR? <span class="unit">(SAR)</span></p></li>
<li><p>Batches are submitted every 6 hours, and 95% of them complete within 3 hours. The owner needs nearly every result within 8 hours of the request. Does the schedule meet the need?</p><ul><li><b>A.</b> Yes: a batch completes within 3 hours</li><li><b>B.</b> No: a request can wait 6 hours, then 3</li><li><b>C.</b> Yes: the average wait is 3 hours, plus 3</li><li><b>D.</b> No: the provider promises only 24 hours</li></ul></li>
<li><p>A job already runs on a batch tier at half the price. Its prompt is 10% fixed instructions and 90% a transcript that never repeats. Why does adding a prefix cache change the bill only a little?</p><ul><li><b>A.</b> The cache discounts only the fixed 10% of the input</li><li><b>B.</b> Two discounts are never combined on one batch tier request</li><li><b>C.</b> The batch tier already caches the whole prompt</li><li><b>D.</b> Cached tokens cost more on a batch tier</li></ul></li>
<li><p>An agent handles 1,000 disputes at SAR 0.50 of model cost each. It resolves 700 correctly, escalates 200 to a person at SAR 20 each and resolves 100 wrongly, each reworked at SAR 50. What does a correctly resolved dispute cost, people included, in SAR? <span class="unit">(SAR)</span></p></li>
<li><p>Configuration A costs SAR 7.00 per correctly resolved dispute, people included, and 5% of its resolutions are wrong. B costs SAR 6.20, and 9% are wrong. The owner's floor is at most 6% wrong. Which runs in production?</p><ul><li><b>A.</b> B, because it costs less per resolved dispute</li><li><b>B.</b> B, after the floor is moved to 9% wrong</li><li><b>C.</b> B for half of the disputes, to average 7% wrong</li><li><b>D.</b> A, because B is cheaper and fails the floor</li></ul></li>
<li><p>5,000 agent sessions cost SAR 4,000. Outcomes exist for 4,600 of them, and 3,800 of those were resolved. The 400 sessions without an outcome cost SAR 500. An analyst reports 4,000 / 3,800 as the cost per resolved session. What is wrong with it?</p><ul><li><b>A.</b> The cost holds unreviewed sessions; the outcomes do not</li><li><b>B.</b> The unreviewed sessions should all be counted as resolved</li><li><b>C.</b> The unreviewed sessions should be counted as failed</li><li><b>D.</b> No unit cost exists until every session is reviewed</li></ul></li>
<li><p>Five candidates, in SAR a month: A saves 3,000 and holds its quality floor; B saves 2,500 and fails its floor; C saves 900, D saves 600 and E saves 200, and all three hold theirs. Which three does the review recommend?</p><ul><li><b>A.</b> A, B and C</li><li><b>B.</b> A, C and D</li><li><b>C.</b> C, D and E</li></ul></li>
<li><p>A provider publishes no energy figures. The team has assumed watt-hours per thousand tokens for each tier. How does energy appear in the cost review?</p><ul><li><b>A.</b> It is left out until measured figures exist</li><li><b>B.</b> As a measured figure, since the tokens are measured</li><li><b>C.</b> Per thousand requests beside cost, labelled as assumed</li><li><b>D.</b> As the cost divided by the price of electricity</li></ul></li>
<li><p>A review has three options, in SAR a month: 1,000 on the lease of a node, 600 on the tier of a batch job, and 400 on the prompts of the same batch job, measured before the tier change. Which total can the review promise?</p><ul><li><b>A.</b> SAR 1,000</li><li><b>B.</b> SAR 1,600</li><li><b>C.</b> SAR 2,000</li></ul></li>
<li><p>A layout change was measured on a replay of two busy hours and cut the cost of those hours by 80%. The evaluation tasks were not run again. Which sentence belongs in the review?</p><ul><li><b>A.</b> The change saves 80% of the application's monthly spend</li><li><b>B.</b> Quality is unchanged, as the prompt holds the same words</li><li><b>C.</b> Nothing was left out: every figure comes from the log</li><li><b>D.</b> Measured on two busy hours; quality was not retested</li></ul></li>
</ol>
